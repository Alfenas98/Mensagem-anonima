<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel - Mensagens Anônimas</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f4f4f8;
    min-height: 100vh;
  }
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1b4b, #4c1d95);
    padding: 20px;
  }
  .login-card {
    background: white;
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .login-card h1 { font-size: 20px; margin: 0 0 16px; color: #1e1b4b; }
  input[type=password] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
  }
  .login-card button {
    margin-top: 12px;
    width: 100%;
    background: #7c3aed;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .err { color: #b91c1c; font-size: 13px; margin-top: 8px; }

  header {
    background: #1e1b4b;
    color: white;
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 18px; margin: 0; }
  header button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .container { max-width: 700px; margin: 24px auto; padding: 0 16px; }
  .message {
    background: white;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    position: relative;
  }
  .message.unread { border-left: 4px solid #7c3aed; }
  .message .text { font-size: 15px; color: #222; white-space: pre-wrap; margin-bottom: 8px; }
  .message .meta { font-size: 12px; color: #999; display: flex; justify-content: space-between; }
  .message .actions button {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 12px;
    color: #7c3aed;
    margin-left: 10px;
  }
  .message .actions button.del { color: #b91c1c; }
  .empty { text-align: center; color: #999; margin-top: 60px; font-size: 14px; }
</style>
</head>
<body>

<div id="loginWrap" class="login-wrap" style="display:none;">
  <div class="login-card">
    <h1>🔒 Painel de mensagens</h1>
    <input type="password" id="password" placeholder="Senha de acesso" />
    <button id="loginBtn">Entrar</button>
    <div id="loginErr" class="err"></div>
  </div>
</div>

<div id="panelWrap" style="display:none;">
  <header>
    <h1>Mensagens recebidas</h1>
    <button id="logoutBtn">Sair</button>
  </header>
  <div class="container" id="list"></div>
</div>

<script>
  const loginWrap = document.getElementById('loginWrap');
  const panelWrap = document.getElementById('panelWrap');
  const list = document.getElementById('list');

  async function checkSession() {
    const res = await fetch('/api/session');
    const data = await res.json();
    if (data.authenticated) {
      showPanel();
    } else {
      loginWrap.style.display = 'flex';
    }
  }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('loginErr');
    errEl.textContent = '';
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    if (res.ok) {
      loginWrap.style.display = 'none';
      showPanel();
    } else {
      errEl.textContent = 'Senha incorreta.';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    location.reload();
  });

  function showPanel() {
    panelWrap.style.display = 'block';
    loadMessages();
  }

  async function loadMessages() {
    const res = await fetch('/api/messages');
    if (!res.ok) { location.reload(); return; }
    const messages = await res.json();
    if (messages.length === 0) {
      list.innerHTML = '<div class="empty">Nenhuma mensagem ainda.</div>';
      return;
    }
    list.innerHTML = messages.map(renderMessage).join('');
    list.querySelectorAll('[data-read]').forEach(btn => {
      btn.addEventListener('click', () => markRead(btn.dataset.read));
    });
    list.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', () => deleteMessage(btn.dataset.del));
    });
  }

  function renderMessage(m) {
    const date = new Date(m.created_at).toLocaleString('pt-BR');
    return `
      <div class="message ${m.read ? '' : 'unread'}">
        <div class="text">${escapeHtml(m.content)}</div>
        <div class="meta">
          <span>${date}</span>
          <span class="actions">
            ${!m.read ? `<button data-read="${m.id}">Marcar como lida</button>` : ''}
            <button class="del" data-del="${m.id}">Excluir</button>
          </span>
        </div>
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function markRead(id) {
    await fetch(`/api/messages/${id}/read`, { method: 'POST' });
    loadMessages();
  }

  async function deleteMessage(id) {
    if (!confirm('Excluir esta mensagem?')) return;
    await fetch(`/api/messages/${id}`, { method: 'DELETE' });
    loadMessages();
  }

  checkSession();
</script>
</body>
</html>
