<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mensagem Anônima</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1e1b4b, #4c1d95);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 { font-size: 22px; margin: 0 0 6px; color: #1e1b4b; }
  p.sub { color: #666; margin: 0 0 20px; font-size: 14px; }
  textarea {
    width: 100%;
    min-height: 140px;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    resize: vertical;
    font-family: inherit;
  }
  textarea:focus { outline: none; border-color: #7c3aed; }
  button {
    margin-top: 14px;
    width: 100%;
    background: #7c3aed;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button:hover:not(:disabled) { background: #6d28d9; }
  .msg { margin-top: 12px; font-size: 14px; text-align: center; }
  .msg.ok { color: #15803d; }
  .msg.err { color: #b91c1c; }
  .counter { text-align: right; font-size: 12px; color: #999; margin-top: 4px; }
</style>
</head>
<body>
  <div class="card">
    <h1>💬 Mande uma mensagem anônima</h1>
    <p class="sub">Ninguém saberá quem enviou. Fique à vontade.</p>
    <textarea id="content" maxlength="2000" placeholder="Escreva aqui..."></textarea>
    <div class="counter"><span id="count">0</span>/2000</div>
    <button id="sendBtn">Enviar</button>
    <div id="feedback" class="msg"></div>
  </div>

  <script>
    const textarea = document.getElementById('content');
    const counter = document.getElementById('count');
    const btn = document.getElementById('sendBtn');
    const feedback = document.getElementById('feedback');

    textarea.addEventListener('input', () => {
      counter.textContent = textarea.value.length;
    });

    btn.addEventListener('click', async () => {
      const content = textarea.value.trim();
      feedback.textContent = '';
      feedback.className = 'msg';
      if (!content) {
        feedback.textContent = 'Escreva algo antes de enviar.';
        feedback.classList.add('err');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Enviando...';
      try {
        const res = await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content }),
        });
        const data = await res.json();
        if (res.ok) {
          textarea.value = '';
          counter.textContent = '0';
          feedback.textContent = 'Mensagem enviada com sucesso!';
          feedback.classList.add('ok');
        } else {
          feedback.textContent = data.error || 'Erro ao enviar.';
          feedback.classList.add('err');
        }
      } catch (e) {
        feedback.textContent = 'Erro de conexão. Tente novamente.';
        feedback.classList.add('err');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar';
      }
    });
  </script>
</body>
</html>
